<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>UnLink</title>
  <link rel="stylesheet" href="../ui/page.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <img class="logo" src="/icons/icon128.png" alt="" />
    <h1>UnLink</h1>
    <button class="icon-btn" id="open-options" title="Réglages" aria-label="Réglages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section class="block" id="quick">
    <h2>Action en un clic</h2>
    <label class="row"><span>Ne plus suivre</span><input type="checkbox" class="switch" data-key="unfollow" /></label>
    <label class="row"><span>Retirer la relation</span><input type="checkbox" class="switch" data-key="removeConnection" /></label>
    <div class="row">
      <span>Conversation</span>
      <div class="seg" role="radiogroup" aria-label="Action sur la conversation">
        <label><input type="radio" name="conv" value="delete" data-key="conversationAction" /><span>Supprimer</span></label>
        <label><input type="radio" name="conv" value="archive" data-key="conversationAction" /><span>Archiver</span></label>
        <label><input type="radio" name="conv" value="none" data-key="conversationAction" /><span>Garder</span></label>
      </div>
    </div>
    <div class="row">
      <span>Délai d’annulation</span>
      <div class="seg" role="radiogroup" aria-label="Délai d’annulation">
        <label><input type="radio" name="countdown" value="0" data-key="countdownSeconds" data-type="number" /><span>Aucun</span></label>
        <label><input type="radio" name="countdown" value="1" data-key="countdownSeconds" data-type="number" /><span>1 s</span></label>
        <label><input type="radio" name="countdown" value="2" data-key="countdownSeconds" data-type="number" /><span>2 s</span></label>
        <label><input type="radio" name="countdown" value="3" data-key="countdownSeconds" data-type="number" /><span>3 s</span></label>
      </div>
    </div>
  </section>

  <section class="block" id="rules">
    <label class="row head"><h2>Relances sans réponse</h2><input type="checkbox" class="switch" data-key="highlight.enabled" aria-label="Surligner les relances" /></label>
    <div data-enabled-by="highlight.enabled" class="rules">
      <div class="rule">
        <input type="checkbox" class="switch" data-key="highlight.byCount" aria-label="Règle nombre de messages" />
        <span data-enabled-by="highlight.enabled,highlight.byCount">Dès <input type="number" min="1" max="50" data-key="highlight.minMessages" /> messages sans réponse</span>
      </div>
      <div class="rule">
        <input type="checkbox" class="switch" data-key="highlight.byDelay" aria-label="Règle délai" />
        <span data-enabled-by="highlight.enabled,highlight.byDelay">Depuis plus de <input type="number" min="1" max="365" data-key="highlight.delayValue" />
          <select data-key="highlight.delayUnit"><option value="hours">heures</option><option value="days">jours</option></select>
          <span class="nowrap">(dès <input type="number" min="1" max="50" data-key="highlight.delayMinMessages" /> msg)</span></span>
      </div>
      <div class="row">
        <span>Combiner</span>
        <div class="seg" role="radiogroup" aria-label="Combinaison des règles">
          <label><input type="radio" name="combine" value="any" data-key="highlight.combine" /><span>L’une ou l’autre</span></label>
          <label><input type="radio" name="combine" value="all" data-key="highlight.combine" /><span>Les deux</span></label>
        </div>
      </div>
    </div>
  </section>

  <button class="block bulk-btn" id="open-bulk"><b>Nettoyage en masse</b><span class="muted small">Traiter plusieurs relances d’un coup</span><span class="arrow" aria-hidden="true">→</span></button>

  <footer class="foot small muted">
    <span id="shortcuts"></span>
    <span id="cleaned"></span>
  </footer>

  <script src="../shared/settings.js"></script>
  <script src="../shared/stats.js"></script>
  <script src="../ui/bind.js"></script>
  <script src="popup.js"></script>
</body>
</html>
