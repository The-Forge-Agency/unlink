name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Vérifications statiques
        run: npm run check
      - name: Tests unitaires
        run: npm test
      - name: Test de bout en bout (faux LinkedIn local)
        run: xvfb-run --auto-servernum npm run e2e
      - name: Paquet du Chrome Web Store
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: unlink-zip
          path: dist/*.zip
